[pytest]
# Lists the two locations that hold tests -- the four modules under test/ and
# the three at the repository root. This makes the intended set explicit.
#
# It does NOT stop auto-discovery: `testpaths` entries are directories, and `.`
# is scanned recursively, so a stray test_*.py anywhere in the tree is still
# collected. Verified: dropping providers/test_stray.py in raises the collected
# count by exactly one. That is standard pytest behaviour, and it holds no
# matter what the suite size is. To exclude a directory, use
# `collect_ignore` or `norecursedirs` -- do not rely on this list to fence the
# collection set.
#
# Three test modules live at the repository root
# (test_ai_advisor_complete.py, test_ai_advisor_context.py,
# test_analyze_costs_integration.py) alongside the four in test/, so both
# locations must be listed.
#
# NOTE: testpaths is resolved relative to the directory pytest is INVOKED
# from, not relative to rootdir. Run the suite from the repository root:
#
#     python -m pytest -q
#
# which is what CI and the .hermes/environment.json recipe both do.
testpaths = test .

# Put the repository root on sys.path so the root-level test modules can
# `import core.*` / `import providers.*`. This is belt-and-braces rather than
# load-bearing when running from the repository root: pytest's rootdir
# insertion already covers the common case, and dropping this option (verified:
# `-o pythonpath=`) still gives a green run. Kept as an explicit statement of
# intent, and because it does cover invocations from outside the root.
pythonpath = .

addopts = -ra
